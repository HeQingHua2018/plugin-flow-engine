name: CI

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - 'packages/doc/**'
      - '**.md'
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm run lint:eslint || echo 'Lint warnings found (non-blocking)'

      - name: Run tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build
